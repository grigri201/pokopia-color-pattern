<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokopia Color Pattern</title>
    <style>
      :root {
        --paper: #f5efe2;
        --paper-soft: #fbf7ee;
        --ink: #1c1a17;
        --muted: #6f665d;
        --line: rgba(28, 26, 23, 0.18);
        --line-strong: rgba(28, 26, 23, 0.36);
        --field: #e9b5c2;
        --field-ink: #1c1a17;
        --accent: #bb5a70;
        --olive: #727a50;
        --sky: #7094a3;
        --shadow: 0 26px 70px rgba(32, 25, 18, 0.2);
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.45;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100%;
        margin: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.1)),
          var(--field);
        color: var(--ink);
        transition: background-color 420ms ease;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
          radial-gradient(rgba(28, 26, 23, 0.1) 1px, transparent 1px);
        background-position:
          0 0,
          0 0,
          7px 9px;
        background-size:
          44px 44px,
          44px 44px,
          18px 18px;
        mix-blend-mode: soft-light;
        opacity: 0.54;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(520px, 34vw);
        min-height: 100vh;
      }

      .rail,
      .inspector {
        height: 100vh;
        overflow: hidden;
        background: rgba(245, 239, 226, 0.86);
        backdrop-filter: blur(18px);
      }

      .rail {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 30;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        width: min(360px, calc(100vw - 36px));
        border-right: 1px solid var(--line);
        box-shadow: 24px 0 80px rgba(28, 26, 23, 0.22);
        transform: translateX(calc(-100% - 48px));
        transition: transform 240ms ease;
      }

      .inspector {
        position: sticky;
        top: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        border-left: 1px solid var(--line);
      }

      body.drawer-open {
        overflow: hidden;
      }

      body.drawer-open .rail {
        transform: translateX(0);
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 25;
        border: 0;
        background: rgba(28, 26, 23, 0.34);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      body.drawer-open .drawer-backdrop {
        opacity: 1;
        pointer-events: auto;
      }

      .selected-float {
        position: fixed;
        left: 22px;
        top: 22px;
        z-index: 20;
        display: grid;
        grid-template-columns: 58px 1fr 46px;
        align-items: center;
        gap: 12px;
        width: min(310px, calc(100vw - 44px));
        min-height: 82px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: rgba(245, 239, 226, 0.92);
        box-shadow: 0 18px 44px rgba(28, 26, 23, 0.2);
        cursor: pointer;
        padding: 10px 12px;
        text-align: left;
        backdrop-filter: blur(18px);
      }

      body.drawer-open .selected-float {
        opacity: 0;
        pointer-events: none;
      }

      .float-thumb {
        width: 58px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 10px 14px rgba(28, 26, 23, 0.16));
      }

      .float-copy {
        min-width: 0;
      }

      .float-copy strong,
      .float-copy span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .float-copy strong {
        font-weight: 800;
      }

      .float-copy span {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .float-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }

      .float-meta span {
        width: fit-content;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 7px;
        background: rgba(255, 255, 255, 0.28);
        color: var(--muted);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.66rem;
        font-weight: 700;
      }

      .float-action {
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        transform-origin: 50% 88%;
        animation: drawerNudge 15s ease-in-out infinite;
      }

      .pokeball-icon {
        width: 42px;
        height: 42px;
        overflow: visible;
        filter: drop-shadow(0 6px 6px rgba(28, 26, 23, 0.2));
      }

      @keyframes drawerNudge {
        0%,
        90%,
        100% {
          transform: translateX(0) rotate(0deg);
        }

        92% {
          transform: translateX(-7px) rotate(-20deg);
        }

        94% {
          transform: translateX(7px) rotate(20deg);
        }

        96% {
          transform: translateX(-5px) rotate(-14deg);
        }

        98% {
          transform: translateX(3px) rotate(8deg);
        }
      }

      .brand-block,
      .search-block,
      .source-block,
      .panel-head,
      .panel-scroll {
        padding: 24px;
      }

      .brand-block {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        border-bottom: 1px solid var(--line);
      }

      .brand-copy {
        min-width: 0;
      }

      .drawer-close {
        width: 36px;
        height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        cursor: pointer;
        font-size: 1.3rem;
        line-height: 1;
      }

      .kicker,
      .meta-label,
      .slot-state,
      .tiny-label {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .kicker {
        color: var(--accent);
      }

      .brand-title {
        margin: 12px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.45rem;
        font-weight: 500;
        line-height: 0.95;
      }

      .brand-title em,
      .stage-title em {
        font-style: italic;
        font-weight: 400;
      }

      .brand-note,
      .source-block,
      .detail-copy {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .brand-note {
        margin: 14px 0 0;
        max-width: 24ch;
      }

      .search-block {
        display: grid;
        gap: 14px;
        border-bottom: 1px solid var(--line);
      }

      .search-field {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        min-height: 42px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.34);
      }

      .search-field input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 10px 12px;
        color: var(--ink);
      }

      .search-field span {
        padding: 0 12px;
        color: var(--muted);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.78rem;
      }

      .filter-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .filter-row button {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        cursor: pointer;
      }

      .filter-row button.is-active {
        border-color: rgba(28, 26, 23, 0.72);
        background: var(--ink);
        color: var(--paper);
      }

      .pokemon-list {
        display: grid;
        align-content: start;
        gap: 0;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: auto;
        list-style: none;
      }

      .pokemon-item {
        width: 100%;
        min-height: 68px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
        display: grid;
        grid-template-columns: 50px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 9px 18px 9px 24px;
        text-align: left;
      }

      .pokemon-item:hover,
      .pokemon-item.is-active {
        background: rgba(255, 255, 255, 0.34);
      }

      .pokemon-item.is-active {
        box-shadow: inset 4px 0 0 var(--accent);
      }

      .thumb {
        width: 50px;
        height: 50px;
        object-fit: contain;
        filter: drop-shadow(0 10px 14px rgba(28, 26, 23, 0.16));
      }

      .pokemon-name {
        min-width: 0;
      }

      .pokemon-name strong,
      .slot-name strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pokemon-name span,
      .slot-name span {
        display: block;
        overflow: hidden;
        color: var(--muted);
        font-size: 0.78rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .seq {
        color: rgba(28, 26, 23, 0.48);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.74rem;
      }

      .source-block {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
      }

      .stage {
        min-width: 0;
        color: var(--field-ink);
      }

      .stage-inner {
        display: grid;
        grid-template-rows: auto minmax(470px, 1fr) auto;
        gap: 16px;
        min-height: 100vh;
        padding: 34px 42px;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 22px;
        padding-left: 330px;
      }

      .hash-pill {
        max-width: 26ch;
        overflow: hidden;
        border-bottom: 1px solid currentColor;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.76rem;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(240px, 0.9fr);
        align-items: center;
        gap: 42px;
        padding: 40px 0;
      }

      .stage-title {
        margin: 0;
        max-width: 9ch;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 6rem;
        font-weight: 500;
        line-height: 0.88;
      }

      .stage-subtitle {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 16px;
        align-items: center;
        max-width: 620px;
        margin-top: 28px;
      }

      .stage-subtitle::before {
        width: 82px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.5;
      }

      .stage-subtitle .metric-strip {
        width: 100%;
        max-width: none;
      }

      .portrait-frame {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 430px;
        border: 1px solid currentColor;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0)),
          rgba(255, 255, 255, 0.1);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .portrait-frame::before,
      .portrait-frame::after {
        position: absolute;
        inset: 22px;
        border: 1px dotted currentColor;
        content: "";
        opacity: 0.42;
      }

      .portrait-frame::after {
        inset: 38px;
        border-style: solid;
        opacity: 0.18;
      }

      .selected-portrait {
        position: relative;
        z-index: 1;
        width: min(72%, 360px);
        aspect-ratio: 1;
        object-fit: contain;
        image-rendering: auto;
        filter: drop-shadow(0 28px 28px rgba(20, 15, 10, 0.28));
      }

      .portrait-number {
        position: absolute;
        right: 18px;
        bottom: 10px;
        z-index: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 8rem;
        font-style: italic;
        line-height: 0.8;
        opacity: 0.2;
      }

      .metric-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        max-width: 620px;
        border: 1px solid currentColor;
        background: rgba(255, 255, 255, 0.12);
      }

      .metric {
        min-height: 54px;
        padding: 10px 12px;
        border-right: 1px solid currentColor;
      }

      .metric:last-child {
        border-right: 0;
      }

      .metric strong {
        display: block;
        overflow-wrap: anywhere;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.12rem;
        font-weight: 500;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-bottom: 5px;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.68rem;
        font-weight: 700;
      }

      .stage-analysis {
        display: grid;
        gap: 12px;
        border-top: 1px solid currentColor;
        padding: 10px 0 12px;
        color: var(--field-ink);
      }

      .analysis-grid {
        display: grid;
        grid-template-columns: minmax(320px, 0.95fr) minmax(300px, 1.05fr);
        gap: 16px;
        align-items: start;
      }

      .analysis-card {
        min-width: 0;
        border: 1px solid currentColor;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        padding: 12px;
      }

      .panel-head {
        display: grid;
        gap: 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        font-weight: 500;
        line-height: 1;
      }

      .palette-bars {
        display: flex;
        height: 56px;
        border: 1px solid var(--line-strong);
        overflow: hidden;
      }

      .palette-bars span {
        min-width: 0;
        flex-grow: 1;
      }

      .panel-scroll {
        display: grid;
        align-content: start;
        gap: 26px;
        min-height: 0;
        overflow: auto;
      }

      .section-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 8px;
      }

      .section-label h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.28rem;
        font-weight: 500;
      }

      .swatch-list {
        display: grid;
        gap: 4px;
      }

      .swatch-row {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 9px;
        min-height: 32px;
        border-bottom: 1px solid var(--line);
      }

      .swatch {
        width: 34px;
        height: 24px;
        border: 1px solid rgba(28, 26, 23, 0.18);
        border-radius: 6px;
      }

      .swatch-info {
        min-width: 0;
      }

      .swatch-info strong,
      .swatch-info span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .swatch-info strong {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.7rem;
      }

      .swatch-info span {
        color: var(--muted);
        font-size: 0.64rem;
      }

      .percent {
        color: var(--muted);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.75rem;
      }

      .pattern-view {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        grid-auto-rows: 24px;
        gap: 4px;
      }

      .item-filter {
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.28);
        color: var(--ink);
        cursor: pointer;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 4px 24px 4px 10px;
      }

      .pattern-cell {
        border: 1px solid rgba(28, 26, 23, 0.14);
        border-radius: 4px;
        background: var(--accent);
      }

      .furniture-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .slot {
        display: grid;
        gap: 8px;
        min-height: 154px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.08)),
          rgba(255, 255, 255, 0.24);
        padding: 10px;
      }

      .slot-visual {
        display: grid;
        place-items: center;
        min-height: 76px;
        border: 1px dotted var(--line-strong);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.26);
      }

      .slot-visual img {
        max-width: 76px;
        max-height: 66px;
        object-fit: contain;
        filter: drop-shadow(0 12px 14px rgba(28, 26, 23, 0.16));
      }

      .empty-mark {
        color: rgba(28, 26, 23, 0.32);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.8rem;
        line-height: 1;
      }

      .slot-state {
        color: var(--accent);
      }

      .loading {
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: var(--field-ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
      }

      .is-hidden {
        display: none;
      }

      @media (max-width: 1180px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .furniture-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .inspector {
          position: relative;
          height: auto;
          min-height: 0;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .panel-scroll {
          overflow: visible;
        }
      }

      @media (max-width: 880px) {
        .app-shell {
          display: block;
        }

        .inspector {
          position: relative;
          height: auto;
          overflow: visible;
        }

        .pokemon-list {
          max-height: 42vh;
        }

        .stage-inner {
          min-height: auto;
          padding: 120px 18px 24px;
        }

        .topline,
        .stage-subtitle {
          display: grid;
        }

        .topline {
          padding-left: 0;
        }

        .selected-float {
          top: 14px;
          bottom: auto;
          left: 18px;
          width: calc(100vw - 36px);
        }

        .hero-grid,
        .analysis-grid,
        .panel-scroll {
          grid-template-columns: 1fr;
        }

        .stage-title {
          font-size: 4.1rem;
        }

        .portrait-frame {
          min-height: 320px;
        }

        .metric-strip {
          grid-template-columns: 1fr;
          max-width: none;
        }

        .metric {
          border-right: 0;
          border-bottom: 1px solid currentColor;
        }

        .metric:nth-last-child(-n + 1) {
          border-bottom: 0;
        }
      }

      @media (max-width: 520px) {
        .brand-block,
        .search-block,
        .source-block,
        .panel-head,
        .panel-scroll {
          padding: 18px;
        }

        .stage-title {
          font-size: 3.15rem;
        }

        .filter-row,
        .furniture-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">Pokopia Color Pattern</div>
    <button
      id="drawerTrigger"
      class="selected-float is-hidden"
      type="button"
      aria-controls="pokemonDrawer"
      aria-expanded="false">
      <img id="floatPortrait" class="float-thumb" alt="" />
      <span class="float-copy">
        <strong id="floatName">当前宝可梦</strong>
        <span id="floatMeta" class="float-meta">
          <span>No. 000</span>
        </span>
      </span>
      <span class="float-action" aria-hidden="true">
        <svg class="pokeball-icon" viewBox="0 0 64 64" role="img">
          <defs>
            <clipPath id="pokeballClip">
              <circle cx="32" cy="32" r="25" />
            </clipPath>
          </defs>
          <g clip-path="url(#pokeballClip)">
            <rect x="7" y="7" width="50" height="25" fill="#f04a3f" />
            <rect x="7" y="32" width="50" height="25" fill="#f8f1dc" />
            <path d="M12 16c5-6 14-9 24-8" stroke="#ffafa4" stroke-width="5" stroke-linecap="round" opacity="0.75" />
          </g>
          <circle cx="32" cy="32" r="25" fill="none" stroke="#37251f" stroke-width="3" />
          <path d="M8.5 32h47" stroke="#37251f" stroke-width="5" stroke-linecap="butt" />
          <circle cx="32" cy="32" r="10" fill="#f8f1dc" stroke="#37251f" stroke-width="4" />
          <circle cx="32" cy="32" r="4.5" fill="#ffffff" stroke="#c9beaa" stroke-width="1.5" />
        </svg>
      </span>
    </button>
    <button
      id="drawerBackdrop"
      class="drawer-backdrop"
      type="button"
      aria-label="关闭搜索抽屉"></button>
    <main id="app" class="app-shell is-hidden">
      <aside id="pokemonDrawer" class="rail" data-od-id="pokemon-index" aria-hidden="true">
        <header class="brand-block">
          <div class="brand-copy">
            <div class="kicker">Pokopia / Color Index</div>
            <h1 class="brand-title">Pocket <em>Palette</em></h1>
            <p class="brand-note">宝可梦头像色板、比例与家具搭配候选。</p>
          </div>
          <button id="drawerClose" class="drawer-close" type="button" aria-label="关闭搜索抽屉">×</button>
        </header>

        <div class="search-block">
          <label class="search-field">
            <input id="searchInput" type="search" placeholder="Search / 搜索" autocomplete="off" />
            <span id="resultCount">000</span>
          </label>
          <div class="filter-row" aria-label="Pokemon list range">
            <button class="is-active" type="button" data-range="all">All</button>
            <button type="button" data-range="early">001-120</button>
            <button type="button" data-range="late">121+</button>
          </div>
        </div>

        <ol id="pokemonList" class="pokemon-list" aria-label="Pokopia pokemon"></ol>

        <footer class="source-block">
          <span>311 Pokemon</span>
          <span>115 Furniture</span>
        </footer>
      </aside>

      <section class="stage" data-od-id="selected-pokemon">
        <div class="stage-inner">
          <div class="topline">
            <div id="hashLabel" class="hash-pill">#ditto</div>
          </div>

          <div class="hero-grid">
            <div>
              <h2 id="pokemonTitle" class="stage-title">百变怪 <em>Ditto</em></h2>
              <div class="stage-subtitle">
                <div id="metricStrip" class="metric-strip" aria-label="Primary color values"></div>
              </div>
            </div>

            <figure class="portrait-frame">
              <img id="selectedPortrait" class="selected-portrait" alt="" />
              <figcaption id="portraitNumber" class="portrait-number">063</figcaption>
            </figure>
          </div>

          <section class="stage-analysis" data-od-id="palette-analysis">
            <div class="analysis-grid">
              <section class="analysis-card">
                <div class="section-label">
                  <h2>色板 / Swatches</h2>
                  <span id="paletteTotal" class="tiny-label">0 colors</span>
                </div>
                <div id="swatchList" class="swatch-list"></div>
              </section>

              <section class="analysis-card">
                <div class="section-label">
                  <h2>Pattern</h2>
                  <span id="patternTotal" class="tiny-label">40 cells</span>
                </div>
                <div id="patternView" class="pattern-view" aria-label="Color pattern cells"></div>
              </section>
            </div>
          </section>
        </div>
      </section>

      <aside class="inspector" data-od-id="palette-inspector">
        <header class="panel-head">
          <div>
            <div class="kicker">Item Match</div>
            <h2 class="panel-title">搭配道具</h2>
          </div>
        </header>

        <div class="panel-scroll">
          <section>
            <div class="section-label">
              <h2 id="itemSectionTitle">家具</h2>
              <select id="itemFilter" class="item-filter" aria-label="筛选搭配道具类型">
                <option value="家具">家具</option>
                <option value="装饰">装饰</option>
                <option value="玩具">玩具</option>
                <option value="地块">地块</option>
                <option value="食物">食物</option>
              </select>
            </div>
            <div id="furnitureGrid" class="furniture-grid"></div>
          </section>
        </div>
      </aside>
    </main>

    <script>
      const POKEMON_MANIFEST = "docs/pokopia_image_sources/pokemon_portraits/manifest.csv";
      const FURNITURE_CSV = "docs/pokopia_image_sources/item_furniture_images.csv";
      const DEFAULT_POKEMON = "ditto";
      const paletteCache = new Map();

      const state = {
        pokemon: [],
        furniture: [],
        selected: null,
        query: "",
        range: "all",
        itemCategory: "家具",
      };

      const els = {
        app: document.querySelector("#app"),
        loading: document.querySelector("#loading"),
        drawer: document.querySelector("#pokemonDrawer"),
        drawerTrigger: document.querySelector("#drawerTrigger"),
        drawerBackdrop: document.querySelector("#drawerBackdrop"),
        drawerClose: document.querySelector("#drawerClose"),
        floatPortrait: document.querySelector("#floatPortrait"),
        floatName: document.querySelector("#floatName"),
        floatMeta: document.querySelector("#floatMeta"),
        pokemonList: document.querySelector("#pokemonList"),
        searchInput: document.querySelector("#searchInput"),
        resultCount: document.querySelector("#resultCount"),
        title: document.querySelector("#pokemonTitle"),
        selectedPortrait: document.querySelector("#selectedPortrait"),
        portraitNumber: document.querySelector("#portraitNumber"),
        hashLabel: document.querySelector("#hashLabel"),
        metricStrip: document.querySelector("#metricStrip"),
        swatchList: document.querySelector("#swatchList"),
        paletteTotal: document.querySelector("#paletteTotal"),
        patternTotal: document.querySelector("#patternTotal"),
        patternView: document.querySelector("#patternView"),
        furnitureGrid: document.querySelector("#furnitureGrid"),
        itemFilter: document.querySelector("#itemFilter"),
        itemSectionTitle: document.querySelector("#itemSectionTitle"),
      };

      async function boot() {
        const [pokemonCsv, furnitureCsv] = await Promise.all([
          fetch(POKEMON_MANIFEST).then((res) => res.text()),
          fetch(FURNITURE_CSV).then((res) => res.text()),
        ]);

        state.pokemon = parseCsv(pokemonCsv)
          .filter((row) => row.status === "ok" && row.kind === "pokemon")
          .map((row) => ({
            sequence: row.sequence,
            name: row.name,
            zh: row.name_zh_hans,
            slug: slugify(row.name),
            image: row.relative_path,
            source: row.source,
          }));

        state.furniture = parseCsv(furnitureCsv)
          .filter((row) => row.kind === "furniture")
          .map((row, index) => ({
            index,
            name: row.name,
            zh: row.name_zh_hans,
            image: row.image_url,
            source: row.source,
          }));

        bindEvents();
        renderList();

        const hashSlug = slugify(decodeURIComponent(location.hash.replace(/^#/, "")));
        const initial =
          state.pokemon.find((pokemon) => pokemon.slug === hashSlug) ||
          state.pokemon.find((pokemon) => pokemon.slug === DEFAULT_POKEMON) ||
          state.pokemon[0];

        els.loading.classList.add("is-hidden");
        els.app.classList.remove("is-hidden");
        els.drawerTrigger.classList.remove("is-hidden");
        selectPokemon(initial.slug, false);
      }

      function bindEvents() {
        els.drawerTrigger.addEventListener("click", openDrawer);
        els.drawerBackdrop.addEventListener("click", closeDrawer);
        els.drawerClose.addEventListener("click", closeDrawer);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            closeDrawer();
          }
        });

        els.searchInput.addEventListener("input", (event) => {
          state.query = event.target.value.trim().toLowerCase();
          renderList();
        });

        els.itemFilter.addEventListener("change", (event) => {
          state.itemCategory = event.target.value;
          if (state.selected) {
            renderFurniture(state.selected);
          }
        });

        document.querySelectorAll("[data-range]").forEach((button) => {
          button.addEventListener("click", () => {
            state.range = button.dataset.range;
            document
              .querySelectorAll("[data-range]")
              .forEach((item) => item.classList.toggle("is-active", item === button));
            renderList();
          });
        });

        window.addEventListener("hashchange", () => {
          const slug = slugify(decodeURIComponent(location.hash.replace(/^#/, "")));
          if (slug && (!state.selected || slug !== state.selected.slug)) {
            selectPokemon(slug, false);
          }
        });
      }

      function renderList() {
        const filtered = state.pokemon.filter((pokemon) => {
          const index = Number(pokemon.sequence);
          const matchesRange =
            state.range === "all" ||
            (state.range === "early" && index <= 120) ||
            (state.range === "late" && index > 120);
          const haystack = `${pokemon.sequence} ${pokemon.name} ${pokemon.zh}`.toLowerCase();
          return matchesRange && (!state.query || haystack.includes(state.query));
        });

        els.resultCount.textContent = String(filtered.length).padStart(3, "0");
        els.pokemonList.innerHTML = filtered
          .map(
            (pokemon) => `
              <li>
                <button class="pokemon-item${state.selected?.slug === pokemon.slug ? " is-active" : ""}"
                  type="button"
                  data-slug="${pokemon.slug}"
                  aria-label="${escapeHtml(pokemon.zh)} ${escapeHtml(pokemon.name)}">
                  <img class="thumb" src="${pokemon.image}" alt="" loading="lazy" />
                  <span class="pokemon-name">
                    <strong>${escapeHtml(pokemon.zh)}</strong>
                    <span>${escapeHtml(pokemon.name)}</span>
                  </span>
                  <span class="seq">${pokemon.sequence}</span>
                </button>
              </li>
            `,
          )
          .join("");

        els.pokemonList.querySelectorAll("[data-slug]").forEach((button) => {
          button.addEventListener("click", async () => {
            await selectPokemon(button.dataset.slug);
            closeDrawer();
          });
        });
      }

      function openDrawer() {
        document.body.classList.add("drawer-open");
        els.drawer.setAttribute("aria-hidden", "false");
        els.drawerTrigger.setAttribute("aria-expanded", "true");
        window.setTimeout(() => els.searchInput.focus(), 120);
      }

      function closeDrawer() {
        document.body.classList.remove("drawer-open");
        els.drawer.setAttribute("aria-hidden", "true");
        els.drawerTrigger.setAttribute("aria-expanded", "false");
      }

      async function selectPokemon(slug, updateHash = true) {
        const pokemon = state.pokemon.find((item) => item.slug === slug) || state.pokemon[0];
        if (!pokemon) {
          return;
        }

        const palette = await getPalette(pokemon);
        state.selected = { ...pokemon, palette };

        if (updateHash) {
          history.replaceState(null, "", `#${pokemon.slug}`);
        }

        renderList();
        renderStage(state.selected);
        renderInspector(state.selected);
        renderFloatingPokemon(state.selected);
      }

      async function getPalette(pokemon) {
        if (paletteCache.has(pokemon.slug)) {
          return paletteCache.get(pokemon.slug);
        }

        const palette = await extractPalette(pokemon.image);
        paletteCache.set(pokemon.slug, palette);
        return palette;
      }

      function renderStage(pokemon) {
        const primary = pokemon.palette[0] || fallbackColor(pokemon.slug);
        const cmyk = rgbToCmyk(primary.rgb);
        const textColor = readableInk(primary.rgb);

        document.documentElement.style.setProperty("--field", primary.hex);
        document.documentElement.style.setProperty("--field-ink", textColor);
        document.documentElement.style.setProperty("--accent", primary.hex);

        els.title.innerHTML = `${escapeHtml(pokemon.zh)} <em>${escapeHtml(pokemon.name)}</em>`;
        els.selectedPortrait.src = pokemon.image;
        els.selectedPortrait.alt = `${pokemon.zh} ${pokemon.name}`;
        els.portraitNumber.textContent = pokemon.sequence;
        els.hashLabel.textContent = `#${pokemon.slug}`;

        const metricData = [
          ["HEX", primary.hex.toUpperCase()],
          ["RGB", `${primary.rgb.r}, ${primary.rgb.g}, ${primary.rgb.b}`],
          ["CMYK", `${cmyk.c}, ${cmyk.m}, ${cmyk.y}, ${cmyk.k}`],
        ];

        els.metricStrip.innerHTML = metricData
          .map(
            ([label, value]) => `
              <div class="metric">
                <span>${label}</span>
                <strong>${value}</strong>
              </div>
            `,
          )
          .join("");
      }

      function renderFloatingPokemon(pokemon) {
        els.floatPortrait.src = pokemon.image;
        els.floatPortrait.alt = "";
        els.floatName.textContent = `${pokemon.zh} / ${pokemon.name}`;
        els.floatMeta.innerHTML = `
          <span>No. ${pokemon.sequence}</span>
        `;
      }

      function renderInspector(pokemon) {
        renderPalette(pokemon.palette);
        renderPattern(pokemon.palette);
        renderFurniture(pokemon);
      }

      function renderPalette(palette) {
        els.paletteTotal.textContent = `${palette.length} colors`;
        els.swatchList.innerHTML = palette
          .map(
            (color, index) => `
              <div class="swatch-row">
                <span class="swatch" style="background:${color.hex}"></span>
                <span class="swatch-info">
                  <strong>${String(index + 1).padStart(2, "0")} / ${color.hex.toUpperCase()}</strong>
                  <span>RGB ${color.rgb.r}, ${color.rgb.g}, ${color.rgb.b}</span>
                </span>
                <span class="percent">${Math.round(color.percent)}%</span>
              </div>
            `,
          )
          .join("");
      }

      function renderPattern(palette) {
        const cells = 40;
        const normalized = normalizePalette(palette);
        const colors = [];

        normalized.forEach((item) => {
          const count = Math.max(1, Math.round((item.ratio / 100) * cells));
          for (let index = 0; index < count; index += 1) {
            colors.push(item.hex);
          }
        });

        while (colors.length < cells) {
          colors.push(normalized[colors.length % normalized.length].hex);
        }

        els.patternView.innerHTML = colors
          .slice(0, cells)
          .map((hex) => `<span class="pattern-cell" style="background:${hex}"></span>`)
          .join("");
      }

      function renderFurniture(pokemon) {
        const primary = pokemon.palette[0] || fallbackColor(pokemon.slug);
        els.itemSectionTitle.textContent = state.itemCategory;

        if (state.itemCategory !== "家具") {
          const slots = Array.from({ length: 6 }, (_, index) => ({
            label: `Reserve ${String(index + 1).padStart(2, "0")}`,
          }));

          els.furnitureGrid.innerHTML = slots
            .map(
              (slot) => `
                <article class="slot">
                  <div class="slot-visual"><span class="empty-mark">+</span></div>
                  <div class="slot-name">
                    <strong>${state.itemCategory}色板位</strong>
                    <span>Reserved</span>
                  </div>
                  <span class="slot-state">${slot.label}</span>
                </article>
              `,
            )
            .join("");
          return;
        }

        const matches = state.furniture
          .map((item) => ({
            ...item,
            score: furnitureScore(item, primary, pokemon.slug),
          }))
          .sort((left, right) => right.score - left.score)
          .slice(0, 4);

        const slots = [
          ...matches.map((item, index) => ({
            state: "candidate",
            label: `Match ${String(index + 1).padStart(2, "0")}`,
            item,
          })),
          { state: "reserved", label: "Reserve 05" },
          { state: "reserved", label: "Reserve 06" },
        ];

        els.furnitureGrid.innerHTML = slots
          .map((slot) => {
            if (slot.state === "reserved") {
              return `
                <article class="slot">
                  <div class="slot-visual"><span class="empty-mark">+</span></div>
                  <div class="slot-name">
                    <strong>家具色板位</strong>
                    <span>Reserved</span>
                  </div>
                  <span class="slot-state">${slot.label}</span>
                </article>
              `;
            }

            return `
              <article class="slot">
                <div class="slot-visual">
                  <img src="${slot.item.image}" alt="${escapeHtml(slot.item.zh)}" loading="lazy" />
                </div>
                <div class="slot-name">
                  <strong>${escapeHtml(slot.item.zh)}</strong>
                  <span>${escapeHtml(slot.item.name)}</span>
                </div>
                <span class="slot-state">${slot.label}</span>
              </article>
            `;
          })
          .join("");
      }

      async function extractPalette(src) {
        const image = await loadImage(src);
        const size = 128;
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d", { willReadFrequently: true });
        canvas.width = size;
        canvas.height = size;
        context.clearRect(0, 0, size, size);

        const scale = Math.min(size / image.naturalWidth, size / image.naturalHeight);
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        const x = Math.round((size - width) / 2);
        const y = Math.round((size - height) / 2);
        context.drawImage(image, x, y, width, height);

        const { data } = context.getImageData(0, 0, size, size);
        const buckets = new Map();
        let visible = 0;

        for (let index = 0; index < data.length; index += 4) {
          const alpha = data[index + 3];
          if (alpha < 42) {
            continue;
          }

          const rgb = {
            r: data[index],
            g: data[index + 1],
            b: data[index + 2],
          };

          const hsl = rgbToHsl(rgb);
          if (hsl.l > 0.96 && hsl.s < 0.1) {
            continue;
          }

          visible += 1;
          const quantized = quantize(rgb, 24);
          const key = `${quantized.r},${quantized.g},${quantized.b}`;
          const current = buckets.get(key) || {
            rgb: quantized,
            count: 0,
            score: 0,
          };

          const saturationLift = 0.54 + hsl.s * 0.72;
          const outlinePenalty = hsl.l < 0.12 ? 0.42 : 1;
          current.count += 1;
          current.score += saturationLift * outlinePenalty;
          buckets.set(key, current);
        }

        const colors = Array.from(buckets.values())
          .sort((left, right) => right.score - left.score)
          .reduce((acc, color) => {
            const close = acc.find((item) => colorDistance(item.rgb, color.rgb) < 30);
            if (close) {
              close.count += color.count;
              close.score += color.score;
              close.rgb = weightedRgb(close.rgb, color.rgb, close.count, color.count);
            } else if (acc.length < 10) {
              acc.push({ ...color });
            }
            return acc;
          }, [])
          .sort((left, right) => right.score - left.score)
          .slice(0, 6)
          .map((color) => ({
            rgb: color.rgb,
            hex: rgbToHex(color.rgb),
            percent: visible ? (color.count / visible) * 100 : 0,
          }));

        return colors.length ? colors : [fallbackColor(src)];
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let quoted = false;

        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          const next = text[index + 1];

          if (quoted && char === '"' && next === '"') {
            cell += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(cell);
            cell = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") {
              index += 1;
            }
            row.push(cell);
            if (row.some((value) => value.length)) {
              rows.push(row);
            }
            row = [];
            cell = "";
          } else {
            cell += char;
          }
        }

        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }

        const [headers, ...body] = rows;
        return body.map((values) =>
          headers.reduce((record, header, index) => {
            record[header] = values[index] || "";
            return record;
          }, {}),
        );
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.decoding = "async";
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = src;
        });
      }

      function slugify(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function quantize(rgb, step) {
        return {
          r: clamp(Math.round(rgb.r / step) * step, 0, 255),
          g: clamp(Math.round(rgb.g / step) * step, 0, 255),
          b: clamp(Math.round(rgb.b / step) * step, 0, 255),
        };
      }

      function weightedRgb(left, right, leftCount, rightCount) {
        const total = leftCount + rightCount;
        return {
          r: Math.round((left.r * leftCount + right.r * rightCount) / total),
          g: Math.round((left.g * leftCount + right.g * rightCount) / total),
          b: Math.round((left.b * leftCount + right.b * rightCount) / total),
        };
      }

      function rgbToHex(rgb) {
        return `#${[rgb.r, rgb.g, rgb.b]
          .map((value) => clamp(Math.round(value), 0, 255).toString(16).padStart(2, "0"))
          .join("")}`;
      }

      function rgbToHsl(rgb) {
        const r = rgb.r / 255;
        const g = rgb.g / 255;
        const b = rgb.b / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h = 0;
        let s = 0;
        const l = (max + min) / 2;

        if (max !== min) {
          const delta = max - min;
          s = l > 0.5 ? delta / (2 - max - min) : delta / (max + min);
          switch (max) {
            case r:
              h = (g - b) / delta + (g < b ? 6 : 0);
              break;
            case g:
              h = (b - r) / delta + 2;
              break;
            default:
              h = (r - g) / delta + 4;
          }
          h *= 60;
        }

        return { h, s, l };
      }

      function rgbToCmyk(rgb) {
        const r = rgb.r / 255;
        const g = rgb.g / 255;
        const b = rgb.b / 255;
        const k = 1 - Math.max(r, g, b);
        if (k >= 1) {
          return { c: 0, m: 0, y: 0, k: 100 };
        }
        return {
          c: Math.round(((1 - r - k) / (1 - k)) * 100),
          m: Math.round(((1 - g - k) / (1 - k)) * 100),
          y: Math.round(((1 - b - k) / (1 - k)) * 100),
          k: Math.round(k * 100),
        };
      }

      function readableInk(rgb) {
        const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
        return luminance > 0.57 ? "#1c1a17" : "#fff8ea";
      }

      function paletteTone(color) {
        const hsl = rgbToHsl(color.rgb);
        if (hsl.s < 0.16) return "NEUTRAL";
        if (hsl.h < 24 || hsl.h >= 340) return "ROSE";
        if (hsl.h < 58) return "AMBER";
        if (hsl.h < 150) return "GREEN";
        if (hsl.h < 220) return "BLUE";
        if (hsl.h < 290) return "VIOLET";
        return "MAGENTA";
      }

      function normalizePalette(palette) {
        const total = palette.reduce((sum, color) => sum + color.percent, 0) || 1;
        return palette.map((color) => ({
          ...color,
          ratio: (color.percent / total) * 100,
        }));
      }

      function furnitureScore(item, color, slug) {
        const tone = paletteTone(color).toLowerCase();
        const text = `${item.name} ${item.zh}`.toLowerCase();
        const keywords = {
          rose: ["berry", "flower", "antique", "sofa", "bed"],
          amber: ["wood", "straw", "lamp", "camp", "table", "chair"],
          green: ["leaf", "plant", "garden", "flower", "grass"],
          blue: ["beach", "water", "ice", "avalugg", "glass"],
          violet: ["ghost", "mystic", "antique", "lamp"],
          magenta: ["berry", "flower", "sofa", "bed"],
          neutral: ["stone", "brick", "basic", "antique", "closet", "chest"],
        };
        const keywordScore = (keywords[tone] || []).reduce(
          (sum, word) => sum + (text.includes(word) ? 32 : 0),
          0,
        );
        return keywordScore + seededScore(`${slug}-${item.name}-${color.hex}`);
      }

      function seededScore(value) {
        let hash = 2166136261;
        for (let index = 0; index < value.length; index += 1) {
          hash ^= value.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0) % 29;
      }

      function fallbackColor(seed) {
        const hue = seededScore(seed) * 12;
        const rgb = hslToRgb({ h: hue, s: 0.42, l: 0.68 });
        return { rgb, hex: rgbToHex(rgb), percent: 100 };
      }

      function hslToRgb(hsl) {
        const c = (1 - Math.abs(2 * hsl.l - 1)) * hsl.s;
        const x = c * (1 - Math.abs(((hsl.h / 60) % 2) - 1));
        const m = hsl.l - c / 2;
        let r = 0;
        let g = 0;
        let b = 0;

        if (hsl.h < 60) [r, g, b] = [c, x, 0];
        else if (hsl.h < 120) [r, g, b] = [x, c, 0];
        else if (hsl.h < 180) [r, g, b] = [0, c, x];
        else if (hsl.h < 240) [r, g, b] = [0, x, c];
        else if (hsl.h < 300) [r, g, b] = [x, 0, c];
        else [r, g, b] = [c, 0, x];

        return {
          r: Math.round((r + m) * 255),
          g: Math.round((g + m) * 255),
          b: Math.round((b + m) * 255),
        };
      }

      function colorDistance(left, right) {
        return Math.hypot(left.r - right.r, left.g - right.g, left.b - right.b);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      boot().catch((error) => {
        console.error(error);
        els.loading.textContent = "无法读取 Pokopia 数据";
      });
    </script>
