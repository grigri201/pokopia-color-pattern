<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokopia Decor Dex - Color Palettes and Item Matches</title>
    <meta name="description" content="A Pokopia dex for colors, decor, and item matches." />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="loading" class="loading">Pokopia Decor Dex</div>
    <button
      id="drawerTrigger"
      class="selected-float is-hidden"
      type="button"
      aria-controls="pokemonDrawer"
      aria-expanded="false">
      <span class="float-copy">
        <strong id="floatName">Current Pokemon</strong>
        <span id="floatMeta" class="float-meta">
          <span>No. 000</span>
        </span>
      </span>
      <span class="float-action" aria-hidden="true">
        <svg class="pokeball-icon" viewBox="0 0 64 64" role="img">
          <defs>
            <clipPath id="pokeballClip">
              <circle cx="32" cy="32" r="25" />
            </clipPath>
          </defs>
          <g clip-path="url(#pokeballClip)">
            <rect x="7" y="7" width="50" height="25" fill="#f04a3f" />
            <rect x="7" y="32" width="50" height="25" fill="#f8f1dc" />
            <path d="M12 16c5-6 14-9 24-8" stroke="#ffafa4" stroke-width="5" stroke-linecap="round" opacity="0.75" />
          </g>
          <circle cx="32" cy="32" r="25" fill="none" stroke="#37251f" stroke-width="3" />
          <path d="M8.5 32h47" stroke="#37251f" stroke-width="5" stroke-linecap="butt" />
          <circle cx="32" cy="32" r="10" fill="#f8f1dc" stroke="#37251f" stroke-width="4" />
          <circle cx="32" cy="32" r="4.5" fill="#ffffff" stroke="#c9beaa" stroke-width="1.5" />
        </svg>
      </span>
    </button>
    <button
      id="drawerBackdrop"
      class="drawer-backdrop"
      type="button"
      aria-label="Close search drawer"></button>
    <main id="app" class="app-shell is-hidden">
      <aside id="pokemonDrawer" class="rail" data-od-id="pokemon-index" aria-hidden="true">
        <header class="brand-block">
          <div class="brand-copy">
            <div class="kicker">Pokopia / Decor Dex</div>
            <h1 class="brand-title">Pokopia <em>Decor Dex</em></h1>
          </div>
          <button id="drawerClose" class="drawer-close" type="button" aria-label="Close search drawer">×</button>
        </header>

        <div class="search-block">
          <label class="search-field">
            <input
              id="searchInput"
              type="search"
              placeholder="Search"
              autocomplete="off"
              aria-label="Search by Pokemon name, English name, or number" />
            <span id="resultCount" aria-live="polite">000</span>
          </label>
          <div class="filter-row" aria-label="Pokemon list range">
            <button class="is-active" type="button" data-range="all" aria-pressed="true">All</button>
            <button type="button" data-range="early" aria-pressed="false">001-120</button>
            <button type="button" data-range="late" aria-pressed="false">121+</button>
          </div>
        </div>

        <ol id="pokemonList" class="pokemon-list" aria-label="Pokopia pokemon"></ol>

        <footer class="source-block">
          <span>311 Pokemon</span>
        </footer>
      </aside>

      <section class="stage" data-od-id="selected-pokemon">
        <div class="stage-inner">
          <div class="topline">
            <button
              id="fullscreenEntry"
              class="icon-button"
              type="button"
              aria-label="Open fullscreen view"
              title="Open fullscreen view">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path
                  d="M4 8V4h4M12 4h4v4M16 12v4h-4M8 16H4v-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
            <button id="languageToggle" class="hash-pill" type="button" aria-label="Switch to Chinese">Chinese</button>
            <a
              class="icon-link"
              href="https://github.com/grigri201/pokopia-color-pattern"
              target="_blank"
              rel="noreferrer"
              aria-label="GitHub repository">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.87c.68 0 1.36.09 2 .26 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
              </svg>
            </a>
          </div>

          <div class="hero-grid">
            <div>
              <h2 id="pokemonTitle" class="stage-title">Ditto</h2>
              <div class="stage-subtitle">
                <div id="metricStrip" class="metric-strip" aria-label="Primary color values"></div>
              </div>
            </div>

            <figure class="portrait-frame">
              <img id="selectedPortrait" class="selected-portrait" alt="" />
              <figcaption id="portraitNumber" class="portrait-number">063</figcaption>
            </figure>
          </div>

          <section class="stage-analysis" data-od-id="palette-analysis">
            <div class="analysis-grid">
              <section class="analysis-card">
                <div class="section-label">
                  <h2 id="paletteTitle">Swatches</h2>
                  <span id="paletteTotal" class="tiny-label">0 colors</span>
                </div>
                <div id="swatchList" class="swatch-list"></div>
              </section>

              <section class="analysis-card">
                <div class="section-label">
                  <h2 id="patternTitle">Pattern</h2>
                  <span id="patternTotal" class="tiny-label">40 cells</span>
                </div>
                <div id="patternView" class="pattern-view" aria-label="Color pattern cells"></div>
              </section>
            </div>
          </section>
        </div>
      </section>

      <aside class="inspector" data-od-id="palette-inspector">
        <header class="panel-head">
          <div>
            <h2 id="panelTitle" class="panel-title">Item Match</h2>
          </div>
        </header>

        <div class="panel-scroll">
          <section>
            <div class="section-label">
              <h2 id="itemSectionTitle">Recommendations · All</h2>
              <select id="itemFilter" class="item-filter" aria-label="Filter item type">
                <option value="全部">All</option>
                <option value="家具">Furniture</option>
                <option value="装饰">Decor</option>
                <option value="玩具">Toys</option>
                <option value="地块">Blocks</option>
                <option value="食物">Food</option>
              </select>
            </div>
            <div id="furnitureGrid" class="furniture-grid"></div>
          </section>
        </div>
      </aside>
    </main>
    <section
      id="fullscreenOverlay"
      class="fullscreen-layout is-hidden"
      data-od-id="fullscreen-layout"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="fullscreenBrand">
      <header class="fullscreen-toolbar" data-od-id="fullscreen-toolbar">
        <strong id="fullscreenBrand">Pokopia 装饰图鉴</strong>
        <div class="fullscreen-toolbar-actions">
          <button
            id="fullscreenLanguageToggle"
            class="fullscreen-language-toggle"
            type="button"
            aria-label="Switch to Chinese">
            Chinese
          </button>
          <button
            id="fullscreenClose"
            class="fullscreen-close"
            type="button"
            aria-label="Close fullscreen view"
            title="Close fullscreen view">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path
                d="M5 5l10 10M15 5L5 15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <div class="fullscreen-content" data-od-id="fullscreen-content">
        <section class="fullscreen-info" data-od-id="fullscreen-info">
          <section class="fullscreen-identity" data-od-id="fullscreen-identity">
            <div class="fullscreen-meta" id="fullscreenMeta">No. 000 / #ditto</div>
            <h2 class="fullscreen-title" id="fullscreenTitle">Ditto</h2>
          </section>
          <section class="fullscreen-color-stack" data-od-id="fullscreen-color-stack">
            <dl class="fullscreen-primary" id="fullscreenPrimaryValues" aria-label="Primary color values"></dl>

            <section class="fullscreen-card" data-od-id="fullscreen-palette">
              <h3 id="fullscreenPaletteTitle">Swatches</h3>
              <div class="fullscreen-palette" id="fullscreenPalette"></div>
            </section>

            <section class="fullscreen-card fullscreen-pattern-card" data-od-id="fullscreen-pattern">
              <h3 id="fullscreenPatternTitle">Pattern</h3>
              <div class="fullscreen-pattern-grid" id="fullscreenPattern" role="img" aria-label="Color pattern cells"></div>
            </section>
          </section>
          <section class="fullscreen-card fullscreen-preferences" data-od-id="fullscreen-preferences">
            <h3 id="fullscreenPreferencesTitle">Preference Profile</h3>
            <div class="fullscreen-terms" id="fullscreenPreferences"></div>
          </section>
        </section>
        <figure class="fullscreen-pokemon-card" data-od-id="fullscreen-pokemon-card">
          <img id="fullscreenPortrait" src="" alt="" />
          <figcaption id="fullscreenPortraitNumber">000</figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
